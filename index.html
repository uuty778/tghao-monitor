<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TGHAO 订单监控面板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0f;color:#e4e4e7;padding:16px;font-size:14px}
h1{font-size:18px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
h1 .dot{width:8px;height:8px;border-radius:50%;background:#10b981;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
.sub{color:#71717a;font-size:12px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.card{background:#12121a;border:1px solid #252535;border-radius:10px;padding:12px;text-align:center}
.card .num{font-size:20px;font-weight:700}
.card .lbl{font-size:11px;color:#71717a;margin-top:2px}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:#1a1a26;border:1px solid #252535;border-radius:10px;padding:12px;animation:slideIn .3s}
.item.new{border-color:#10b981;box-shadow:0 0 10px rgba(16,185,129,.15)}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.item .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.item .prod{font-weight:600;font-size:14px}
.item .badge{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600}
.badge-new{background:rgba(16,185,129,.15);color:#10b981}
.badge-old{background:rgba(113,113,122,.15);color:#71717a}
.row{display:flex;justify-content:space-between;font-size:12px;color:#71717a;padding:2px 0}
.row .val{color:#e4e4e7;font-weight:500}
.row .val.price{color:#10b981;font-weight:700}
.empty{text-align:center;padding:40px;color:#71717a}
.empty .icon{font-size:36px;margin-bottom:8px}
#notif{position:fixed;top:16px;right:16px;background:#12121a;border:1px solid #10b981;border-radius:10px;padding:12px 16px;box-shadow:0 4px 16px rgba(0,0,0,.5);display:none;max-width:280px;z-index:999}
#notif .t{font-weight:700;color:#10b981;font-size:13px;margin-bottom:4px}
#notif .b{font-size:12px;color:#e4e4e7;line-height:1.5}
</style>
</head>
<body>
<div id="notif"><div class="t">🆕 新订单！</div><div class="b" id="notifBody"></div></div>
<h1><span class="dot"></span> TGHAO 订单监控</h1>
<div class="sub">每10秒自动刷新 · 数据来自服务器</div>
<div class="stats">
  <div class="card"><div class="num" id="total">0</div><div class="lbl">总订单</div></div>
  <div class="card"><div class="num" id="new" style="color:#10b981">0</div><div class="lbl">新订单</div></div>
  <div class="card"><div class="num" id="last">-</div><div class="lbl">上次检查</div></div>
</div>
<div id="list"><div class="empty"><div class="icon">📭</div>加载中...</div></div>

<script>
let lastNewCount = 0;
async function load() {
  try {
    const r = await fetch('orders.json?t=' + Date.now());
    const orders = await r.json();
    render(orders);
  } catch(e) {
    document.getElementById('list').innerHTML = '<div class="empty"><div class="icon">❌</div>加载失败，请检查 orders.json 是否存在</div>';
  }
}
function render(orders) {
  document.getElementById('total').textContent = orders.length;
  const newOnes = orders.filter(o => o._new);
  document.getElementById('new').textContent = newOnes.length;
  document.getElementById('last').textContent = orders[0]?._time?.slice(11,16) || '-';

  // 新订单弹窗
  if (newOnes.length > lastNewCount && lastNewCount > 0) {
    const n = newOnes[0];
    document.getElementById('notifBody').textContent = `${n.goods_name||n.product||''}\n¥${n.amount||n.price||''}\n${n._time||''}`;
    const el = document.getElementById('notif');
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 6000);
  }
  lastNewCount = newOnes.length;

  if (orders.length === 0) {
    document.getElementById('list').innerHTML = '<div class="empty"><div class="icon">📭</div>暂无订单数据</div>';
    return;
  }
  document.getElementById('list').innerHTML = orders.map(o => `
    <div class="item ${o._new?'new':''}">
      <div class="top">
        <div class="prod">${o.goods_name||o.product||'未知商品'}</div>
        <div class="badge ${o._new?'badge-new':'badge-old'}">${o._new?'🆕 NEW':'已读'}</div>
      </div>
      <div class="row"><span>订单号</span><span class="val" style="font-family:monospace;font-size:11px">${o.order_id||o.order_sn||o.id||''}</span></div>
      <div class="row"><span>金额</span><span class="val price">¥${o.amount||o.price||''}</span></div>
      <div class="row"><span>时间</span><span class="val">${o.time||o._time||''}</span></div>
      <div class="row"><span>联系方式</span><span class="val">${o.contact||''}</span></div>
    </div>
  `).join('');
}
load();
setInterval(load, 10000);
</script>
</body>
</html>
